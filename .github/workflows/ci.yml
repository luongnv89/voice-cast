# CI Pipeline for VoiceCast
# Runs linting, security checks, and tests on push and pull requests

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.16.0,<0.17.0' bandit

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run Bandit security linter
        run: bandit -c pyproject.toml -r . --exclude tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1 libegl1 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Install core dependencies (skip heavy ML packages for CI)
          pip install sounddevice soundfile rich numpy tqdm
          # GUI stack so the smoke test exercises the real Qt import chain
          # instead of skipping (F-CI-003); PySide6 also un-skips
          # test_download_streaming.py, whose HF progress bridge needs tqdm
          pip install PySide6 pygame
          # Install the project package (no deps — core ones are above)
          pip install -e . --no-deps

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit
        run: bandit -c pyproject.toml -r . --exclude tests -f json -o bandit-report.json

      # Advisory scan against the fully pinned lockfile via the shared
      # wrapper (single source of the documented advisory baseline); any
      # advisory not in that baseline fails the job.
      - name: Audit dependencies with pip-audit
        run: ./scripts/pip_audit_lockfile.sh

      - name: Upload security report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30
