# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: '\.mp3$|\.wav$|\.jpg$|\.png$'
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "."]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Dependency vulnerability audit against the pinned lockfile (pip-audit
  # replaces the unmaintained safety hook; any advisory outside the documented
  # baseline fails the hook). Requires network access to advisory databases.
  - repo: local
    hooks:
      - id: pip-audit-lockfile
        name: pip-audit dependency vulnerability audit
        entry: scripts/pip_audit_lockfile.sh
        language: python
        additional_dependencies: ["pip-audit>=2.9.0"]
        files: ^requirements\.txt$
        pass_filenames: false

# CI configuration
ci:
  autofix_commit_msg: 'style: auto-fix from pre-commit hooks'
  autofix_prs: true
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  autoupdate_schedule: monthly
